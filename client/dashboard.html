<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Student Dashboard</title>

    <link rel="stylesheet" href="css/dashboard.css">

</head>

<body>

<div class="container">

    <header>

        <h1>🎓 Campus Complaint Portal</h1>

        <h2 id="welcome">Welcome Student</h2>

    </header>

    <!-- Statistics Cards -->

    <section class="stats">

        <div class="card total">

            <h3>Total Complaints</h3>

            <h1 id="totalComplaints">0</h1>

        </div>

        <div class="card pending">

            <h3>Pending</h3>

            <h1 id="pendingComplaints">0</h1>

        </div>

        <div class="card progress">

            <h3>In Progress</h3>

            <h1 id="progressComplaints">0</h1>

        </div>

        <div class="card resolved">

            <h3>Resolved</h3>

            <h1 id="resolvedComplaints">0</h1>

        </div>

    </section>

    <!-- Profile & Actions -->

    <section class="main-grid">

        <div class="profile-card">

            <h2>👤 Student Profile</h2>

            <hr>

            <p><strong>Name :</strong> <span id="studentName"></span></p>

            <p><strong>Student ID :</strong> <span id="studentId"></span></p>

        </div>

        <div class="actions-card">

            <h2>⚡ Quick Actions</h2>

            <hr>

            <a href="complaint.html" class="btn">➕ New Complaint</a>

            <a href="complaints.html" class="btn">📋 My Complaints</a>

            <button id="logoutBtn">🚪 Logout</button>

        </div>

    </section>

    <!-- Recent Complaints -->

    <section class="recent-card">

        <h2>📄 Recent Complaints</h2>

        <hr>

        <table>

            <thead>

                <tr>

                    <th>ID</th>

                    <th>Category</th>

                    <th>Title</th>

                    <th>Status</th>

                </tr>

            </thead>

            <tbody id="recentComplaints">

            </tbody>

        </table>

    </section>

</div>

<!-- SweetAlert2 -->
<script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

<!-- Toast -->
<script src="js/toast.js"></script>

<!-- Dashboard JS -->
<script src="js/dashboard.js"></script>

</body>

</html>
